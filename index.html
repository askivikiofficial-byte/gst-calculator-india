<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GST Calculator India</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-5">

    <div class="card shadow-lg p-4">

        <h1 class="text-center mb-4">
            GST Calculator India
        </h1>

        <div class="row">

            <div class="col-md-6">
                <h4>GST Exclusive</h4>

                <input type="number"
                       id="amount"
                       class="form-control mb-3"
                       placeholder="Enter Amount">

                <select id="gstRate"
                        class="form-select mb-3">

                    <option value="5">5%</option>
                    <option value="12">12%</option>
                    <option value="18" selected>18%</option>
                    <option value="28">28%</option>

                </select>

                <button class="btn btn-primary w-100"
                        onclick="calculateGST()">
                    Calculate
                </button>

                <div class="result mt-4">
                    <p><strong>GST Amount:</strong>
                        ₹<span id="gstAmount">0</span>
                    </p>

                    <p><strong>Total Amount:</strong>
                        ₹<span id="totalAmount">0</span>
                    </p>
                </div>

            </div>

            <div class="col-md-6">
                <h4>GST Inclusive</h4>

                <input type="number"
                       id="inclusiveAmount"
                       class="form-control mb-3"
                       placeholder="Final Amount">

                <select id="inclusiveRate"
                        class="form-select mb-3">

                    <option value="5">5%</option>
                    <option value="12">12%</option>
                    <option value="18" selected>18%</option>
                    <option value="28">28%</option>

                </select>

                <button class="btn btn-success w-100"
                        onclick="calculateInclusiveGST()">
                    Calculate
                </button>

                <div class="result mt-4">

                    <p><strong>Base Amount:</strong>
                        ₹<span id="baseAmount">0</span>
                    </p>

                    <p><strong>GST Amount:</strong>
                        ₹<span id="includedGST">0</span>
                    </p>

                </div>
            </div>

        </div>

        <hr>

        <div class="text-center">

            <h5>Developer Information</h5>

            <p>
                <strong>Vigneshwaran P</strong><br>
                your-email@example.com
            </p>

            <a href="https://digitalheroesco.com"
               target="_blank"
               class="btn btn-dark">
                Built for Digital Heroes
            </a>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
